[workspace]
resolver = "2"
members = ["crates/cube-vault", "crates/cube-pack", "crates/cube-engine", "crates/cube-core", "crates/cube-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
rayon = "1"
anyhow = "1"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
debug = 1
